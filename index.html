<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TCDS — Convergencia</title>
<style>
body{font-family:system-ui,Arial,sans-serif;max-width:980px;margin:28px auto;padding:0 12px;line-height:1.45}
h1{margin:0 0 8px} .meta{color:#555;font-size:.95em;margin-bottom:16px}
.card{border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0}
.btn{display:inline-block;padding:8px 12px;border:1px solid #222;border-radius:8px;text-decoration:none}
.grid{display:grid;gap:10px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
code{background:#f6f8fa;padding:2px 4px;border-radius:4px}
footer{margin:30px 0;color:#666;font-size:.9em}
</style>
<main>
  <h1>TCDS — Convergencia de Repositorios</h1>
  <div class="meta">
    Autor: Genaro Carrasco Ozuna · ORCID: <a href="https://orcid.org/0009-0005-6358-9910" target="_blank">0009-0005-6358-9910</a>
  </div>

  <div style="margin:12px 0">
    <label>Usuario GitHub origen: </label>
    <input id="owner" value="geozunac3536-jpg" style="padding:6px 8px;border:1px solid #ccc;border-radius:8px">
    <button class="btn" id="fetchBtn">Construir Catálogo</button>
  </div>

  <div id="summary" class="meta"></div>

  <div style="margin:12px 0">
    <button class="btn" id="dlCatalogo" disabled>Descargar <code>catalogo.json</code></button>
    <button class="btn" id="dlJSONLD"  disabled>Descargar <code>tcds_convergencia.jsonld</code></button>
  </div>

  <div id="listado" class="grid"></div>

  <footer>
    Esta página consulta la API pública de GitHub desde tu navegador y genera los archivos descargables sin usar servidores externos.
  </footer>
</main>

<script>
const $ = sel => document.querySelector(sel);
const btn = $('#fetchBtn'), list = $('#listado'), sum = $('#summary');
const btnCat = $('#dlCatalogo'), btnLD = $('#dlJSONLD');

function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
}

async function fetchAll(owner){
  // una página basta (<=100 repos). Si crece, agrega paginación.
  const url = `https://api.github.com/users/${owner}/repos?per_page=100`;
  const r = await fetch(url, {headers:{'Accept':'application/vnd.github+json'}});
  if(!r.ok) throw new Error(`GitHub API ${r.status}`);
  return r.json();
}

function draw(repos, owner){
  list.innerHTML = repos.map(x=>{
    const pagesURL = x.has_pages ? `https://${owner}.github.io/${x.name}/` : '';
    return `<div class="card">
      <b>${x.name}</b><br>
      <a class="btn" href="${x.html_url}" target="_blank">Repo</a>
      ${x.has_pages?` <a class="btn" href="${pagesURL}" target="_blank">Pages</a>`:''}
      ${x.homepage?` <a class="btn" href="${x.homepage}" target="_blank">Homepage</a>`:''}
      <div style="margin-top:8px">${x.description||''}</div>
      <div class="meta">Lang: ${x.language||'n/d'} · Topics: ${(x.topics||[]).join(', ')}</div>
    </div>`;
  }).join('');
}

function buildCatalogo(repos){
  return repos.map(x=>({
    name: x.name,
    full_name: x.full_name,
    html_url: x.html_url,
    description: x.description,
    language: x.language,
    default_branch: x.default_branch,
    fork: x.fork,
    created_at: x.created_at,
    updated_at: x.updated_at,
    pushed_at: x.pushed_at,
    license: x.license||{},
    homepage: x.homepage,
    has_pages: !!x.has_pages,
    topics: x.topics||[]
  }));
}

function buildJSONLD(repos, owner){
  const date = new Date().toISOString().slice(0,10);
  return {
    "@context":"https://schema.org",
    "@type":"DataCatalog",
    "name":"Catálogo TCDS — Convergencia",
    "creator":{"@type":"Person","name":"Genaro Carrasco Ozuna","identifier":"ORCID:0009-0005-6358-9910"},
    "dateCreated": date,
    "dataset": repos.map(x=>({
      "@type":"CreativeWork",
      "name": x.name,
      "description": x.description,
      "codeRepository": x.html_url,
      "url": x.has_pages ? `https://${owner}.github.io/${x.name}/` : (x.homepage||null),
      "programmingLanguage": x.language,
      "license": (x.license && x.license.spdx_id && x.license.spdx_id!=="NOASSERTION") ? x.license.spdx_id : null,
      "keywords": x.topics||[]
    }))
  };
}

btn.addEventListener('click', async ()=>{
  btn.disabled = true; btn.textContent = 'Cargando…';
  list.innerHTML = ''; sum.textContent = '';
  btnCat.disabled = btnLD.disabled = true;

  const owner = $('#owner').value.trim();
  try{
    const repos = await fetchAll(owner);
    const catalogo = buildCatalogo(repos);
    const jsonld = buildJSONLD(repos, owner);
    const pagesCount = catalogo.filter(x=>x.has_pages).length;

    sum.textContent = `Repos: ${catalogo.length} · Pages: ${pagesCount} · Fecha: ${new Date().toISOString().slice(0,10)}`;
    draw(catalogo, owner);

    btnCat.disabled = false; btnCat.onclick = ()=>downloadJSON(catalogo, 'catalogo.json');
    btnLD.disabled  = false; btnLD.onclick  = ()=>downloadJSON(jsonld,  'tcds_convergencia.jsonld');
    btn.textContent = 'Reconstruir';
  }catch(e){
    sum.textContent = 'Error: ' + e.message;
  }finally{
    btn.disabled = false;
  }
});
</script>
